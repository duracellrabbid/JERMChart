name: CI Quality & Security Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Pre-Commit Verification Gate (Lint & 100% Coverage)
        run: npm run verify:pre-commit

      - name: Execute Pre-Push Verification Gate (Build & Security Audit)
        run: npm run verify:pre-push
