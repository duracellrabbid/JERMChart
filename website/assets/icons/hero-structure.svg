<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none" role="img" aria-label="Apex International Trust Structure Diagram">
  <!-- ========================================================================= -->
  <!-- JERMChart Hero Structure Diagram Illustration                              -->
  <!-- Standardized fiduciary structure model (Discretionary Trust -> HoldCo ->   -->
  <!-- OpCo / Real Estate SPV / Nominee Custody).                                 -->
  <!-- ========================================================================= -->
  <defs>
    <!-- Background grid dots -->
    <pattern id="canvas-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#334155" opacity="0.35" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shadow filter for floating cards -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Desktop Window Container -->
  <rect x="0" y="0" width="800" height="480" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
  
  <!-- Canvas Grid Background -->
  <rect x="1" y="38" width="798" height="441" fill="url(#canvas-grid)" />

  <!-- Window Header / Titlebar -->
  <rect x="0" y="0" width="800" height="38" rx="12" fill="#0f172a" />
  <rect x="0" y="26" width="800" height="12" fill="#0f172a" />
  <line x1="0" y1="38" x2="800" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />

  <!-- Breadcrumb / Document Title -->
  <text x="76" y="23" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500">
    JERMChart Studio &gt; Apex International Trust &gt; Group Ownership Model.jerm
  </text>

  <!-- Titlebar Status Badges -->
  <rect x="620" y="10" width="82" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="630" cy="19" r="3" fill="#10b981" />
  <text x="638" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">Dagre Flow</text>

  <rect x="710" y="10" width="76" height="18" rx="9" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
  <text x="723" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Export Ready</text>

  <!-- ========================================================================= -->
  <!-- CONNECTORS (Stepped Orthogonal Tree Lines)                                  -->
  <!-- ========================================================================= -->

  <!-- Level 1 (Trust) to Level 2 (HoldCo) Vertical Connector -->
  <path d="M 400 132 L 400 182" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Level 1 -> Level 2 Ownership Percentage Pill -->
  <rect x="376" y="147" width="48" height="20" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
  <text x="400" y="161" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100%</text>

  <!-- Level 2 (HoldCo) to Level 3 Connector Bus -->
  <path d="M 400 262 L 400 298" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M 140 298 L 660 298" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 140 298 L 140 340" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M 400 298 L 400 340" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M 660 298 L 660 340" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Bus Junction Dot -->
  <circle cx="400" cy="298" r="3.5" fill="#38bdf8" />

  <!-- Sibling Connector Percentage / Role Pills -->
  <!-- Left Child Connector Pill (100%) -->
  <rect x="116" y="309" width="48" height="20" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" />
  <text x="140" y="323" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100%</text>

  <!-- Center Child Connector Pill (75%) -->
  <rect x="376" y="309" width="48" height="20" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" />
  <text x="400" y="323" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="700">75%</text>

  <!-- Right Child Connector Pill (Custodian) -->
  <rect x="622" y="309" width="76" height="20" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  <text x="660" y="323" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Custodian</text>

  <!-- ========================================================================= -->
  <!-- LEVEL 1: TRUST CARD (Amber Border #d97706)                                -->
  <!-- ========================================================================= -->
  <g filter="url(#card-shadow)">
    <rect x="260" y="52" width="280" height="80" rx="8" fill="url(#card-gradient)" stroke="#d97706" stroke-width="1.8" />
    
    <!-- Classification Badge & Jurisdiction -->
    <rect x="272" y="62" width="132" height="17" rx="3.5" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="0.8" />
    <text x="278" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5">DISCRETIONARY TRUST</text>
    
    <text x="444" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Cayman Islands</text>

    <!-- Entity Name -->
    <text x="272" y="97" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Apex International Trust</text>

    <!-- Settlor & Protector details -->
    <text x="272" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Settlor: Sterling Family • Protector: Apex Fiduciary</text>
    <text x="272" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Governing Law: Cayman Trusts Law • Established: 2018</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEVEL 2: HOLDING COMPANY (Sky Blue Border #0284c7)                       -->
  <!-- ========================================================================= -->
  <g filter="url(#card-shadow)">
    <rect x="250" y="182" width="300" height="80" rx="8" fill="url(#card-gradient)" stroke="#0284c7" stroke-width="1.8" />
    
    <!-- Classification Badge & Jurisdiction -->
    <rect x="262" y="192" width="144" height="17" rx="3.5" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="0.8" />
    <text x="268" y="204" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5">HOLDING ENTITY (HOLDCO)</text>

    <text x="432" y="204" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">British Virgin Islands</text>

    <!-- Entity Name -->
    <text x="262" y="227" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Global Holdings Ltd</text>

    <!-- Director list & Corporate metadata -->
    <text x="262" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Directors: Apex Corporate Services • Reg BVI #189422</text>
    <text x="262" y="255" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Authorized Capital: US$50,000,000 (Ord Shares: 100% Trust Held)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEVEL 3A: ASIA OPERATING SUBSIDIARY (Emerald Border #0d9488)              -->
  <!-- ========================================================================= -->
  <g filter="url(#card-shadow)">
    <rect x="25" y="340" width="230" height="106" rx="8" fill="url(#card-gradient)" stroke="#0d9488" stroke-width="1.6" />
    
    <!-- Badge & Jurisdiction -->
    <rect x="35" y="350" width="86" height="17" rx="3.5" fill="#134e4a" fill-opacity="0.5" stroke="#0d9488" stroke-width="0.8" />
    <text x="41" y="362" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">100% OWNED</text>

    <text x="175" y="362" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Hong Kong</text>

    <!-- Title & Details -->
    <text x="35" y="386" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Asia Operating Subsidiary Co</text>
    <text x="35" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Commercial Trading &amp; Regional Ops</text>
    <text x="35" y="420" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Revenue: US$32M • Staff: 120 • Active</text>
    <text x="35" y="432" fill="#0d9488" font-family="system-ui, sans-serif" font-size="8.5">CR #294011 • Audit Cleared</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEVEL 3B: EUROPEAN REAL ESTATE SPV (Emerald Border #0d9488)              -->
  <!-- ========================================================================= -->
  <g filter="url(#card-shadow)">
    <rect x="285" y="340" width="230" height="106" rx="8" fill="url(#card-gradient)" stroke="#0d9488" stroke-width="1.6" />
    
    <!-- Badge & Jurisdiction -->
    <rect x="295" y="350" width="82" height="17" rx="3.5" fill="#134e4a" fill-opacity="0.5" stroke="#0d9488" stroke-width="0.8" />
    <text x="301" y="362" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">75% JV</text>

    <text x="430" y="362" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Luxembourg</text>

    <!-- Title & Details -->
    <text x="295" y="386" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">European Real Estate SPV</text>
    <text x="295" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Luxembourg (S.C.Sp) • PropCo</text>
    <text x="295" y="420" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Commercial AUM €45M • JV Partner 25%</text>
    <text x="295" y="432" fill="#0d9488" font-family="system-ui, sans-serif" font-size="8.5">Structure: Tier-2 Ringfenced Asset</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEVEL 3C: PRIVATE BANKING NOMINEE (Indigo Border #6366f1)                -->
  <!-- ========================================================================= -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="340" width="230" height="106" rx="8" fill="url(#card-gradient)" stroke="#6366f1" stroke-width="1.6" />
    
    <!-- Badge & Jurisdiction -->
    <rect x="555" y="350" width="82" height="17" rx="3.5" fill="#312e81" fill-opacity="0.5" stroke="#6366f1" stroke-width="0.8" />
    <text x="561" y="362" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">CUSTODIAN</text>

    <text x="702" y="362" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Singapore</text>

    <!-- Title & Details -->
    <text x="555" y="386" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Private Banking Nominee</text>
    <text x="555" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Custodian • MAS Regulated</text>
    <text x="555" y="420" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Segregated Client Discretionary Portfolio</text>
    <text x="555" y="432" fill="#818cf8" font-family="system-ui, sans-serif" font-size="8.5">Custody: Apex Global Wealth PB</text>
  </g>
</svg>
